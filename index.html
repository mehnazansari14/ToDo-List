<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#355c47">
  <title>My To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202720;
      --muted: #7a8178;
      --line: #e8ebe5;
      --paper: #fff;
      --canvas: #f6f7f3;
      --green: #54775e;
      --green-dark: #3f6049;
      --green-pale: #eaf0e9;
      --nav: #294c3b;
      --nav-light: #3d6851;
      --shadow: 0 24px 64px rgb(40 53 41 / 10%), 0 3px 10px rgb(40 53 41 / 4%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 72px 24px;
      background:
        radial-gradient(ellipse at 10% 2%, rgb(220 233 219 / 80%), transparent 38%),
        radial-gradient(ellipse at 95% 45%, rgb(239 229 208 / 45%), transparent 35%),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .app {
      width: min(100%, 660px);
      margin: 0 auto;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 46px;
      padding: 11px 12px 11px 16px;
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 16px;
      background: linear-gradient(115deg, var(--nav), #355d47 68%, var(--nav-light));
      box-shadow: 0 12px 28px rgb(37 72 53 / 19%);
      color: red;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.04em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 10px;
      background: rgb(255 255 255 / 14%);
      color: #f2f7ef;
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .brand:hover .brand-mark {
      transform: rotate(-7deg) scale(1.05);
      background: #fff;
      color: var(--nav);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      border-radius: 9px;
      padding: 9px 12px;
      color: rgb(255 255 255 / 78%);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .nav-link:hover {
      background: rgb(255 255 255 / 12%);
      color: #fff;
      transform: translateY(-1px);
    }

    .nav-link[aria-current="page"] {
      background: #f3f5eb;
      color: var(--nav);
      box-shadow: 0 2px 6px rgb(16 39 26 / 14%);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #54775e;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 54px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1;
    }

    .today {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgb(229 233 226 / 90%);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: box-shadow .25s ease, transform .25s ease;
    }

    .card:hover {
      box-shadow: 0 28px 72px rgb(40 53 41 / 12%), 0 5px 14px rgb(40 53 41 / 5%);
      transform: translateY(-2px);
    }

    .card-top {
      padding: 26px 28px 22px;
      background: linear-gradient(115deg, #fff 15%, #f3f7f0 100%);
    }

    .summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
    }

    .summary strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .summary span {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf0eb;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #54775e, #7d9c6d);
      transition: width .25s ease;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin: 0 28px 22px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfa;
      transition: border-color .2s, box-shadow .2s;
    }

    .add-form:focus-within {
      border-color: #a8b9a9;
      box-shadow: 0 0 0 3px rgb(84 119 94 / 10%);
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 10px 11px;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
    }

    .add-form input::placeholder { color: #a0a69e; }

    .add-button {
      flex: none;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background .2s, transform .2s;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.97); }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 28px 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .clear-button {
      border: 0;
      padding: 7px 0 7px 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .clear-button:hover { color: #a34e43; }

    .task-list {
      min-height: 142px;
      margin: 0;
      padding: 0 28px;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 58px;
      border-top: 1px solid #f0f1ed;
      animation: appear .2s ease-out;
      transition: background .2s ease, padding .2s ease;
    }

    .task:hover {
      padding-right: 5px;
      padding-left: 5px;
      background: #f8faf6;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-check {
      display: grid;
      width: 20px;
      height: 20px;
      flex: none;
      place-items: center;
      border: 1.5px solid #cbd2c9;
      border-radius: 50%;
      background: #fff;
      color: #fff;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .task-check:hover { border-color: var(--green); }
    .task-check[aria-pressed="true"] {
      border-color: var(--green);
      background: var(--green);
    }

    .task-check[aria-pressed="true"]::after {
      content: "";
      width: 5px;
      height: 9px;
      margin-top: -2px;
      border: solid #fff;
      border-width: 0 1.7px 1.7px 0;
      transform: rotate(45deg);
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      color: #343b34;
      font-size: 14px;
      line-height: 1.45;
    }

    .task.is-done .task-text {
      color: #a1a69f;
      text-decoration: line-through;
      text-decoration-color: #b8beb6;
    }

    .delete-button {
      display: grid;
      width: 30px;
      height: 30px;
      flex: none;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #a0a69e;
      cursor: pointer;
      font-size: 19px;
      opacity: 0;
      transition: opacity .2s, color .2s, background .2s;
    }

    .task:hover .delete-button,
    .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: #fbefed; color: #a34e43; }

    .empty-state {
      display: grid;
      min-height: 142px;
      place-content: center;
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      margin-bottom: 5px;
      color: #434b43;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 500;
    }

    .empty-state span { font-size: 12px; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 0;
      padding: 15px 28px;
      border-top: 1px solid var(--line);
      color: #929990;
      font-size: 11px;
    }

    :focus-visible {
      outline: 3px solid rgb(84 119 94 / 35%);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body { padding: 42px 16px; }
      .navbar { margin-bottom: 36px; padding: 9px 9px 9px 12px; }
      .brand { gap: 8px; font-size: 14px; }
      .brand-mark { width: 30px; height: 30px; }
      .nav-links { gap: 1px; }
      .nav-link { padding: 8px 9px; font-size: 11px; }
      .page-heading { align-items: flex-start; }
      .today { margin-top: 7px; font-size: 11px; }
      .card-top { padding: 22px 20px 19px; }
      .add-form { margin: 0 20px 18px; }
      .list-header { padding-right: 20px; padding-left: 20px; }
      .task-list { padding: 0 20px; }
      .card-footer { padding: 14px 20px; }
      .delete-button { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="top">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="#top" aria-label="Daylist home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>daylist</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="#task-list" data-filter="all" aria-current="page">All tasks</a>
        <a class="nav-link" href="#task-list" data-filter="active">To do</a>
        <a class="nav-link" href="#task-list" data-filter="done">Done</a>
      </div>
    </nav>

    <header class="page-heading">
      <div>
        <p class="eyebrow">A little more clarity</p>
        <h1>My to-do list</h1>
      </div>
      <p class="today" id="today"></p>
    </header>

    <section class="card" aria-label="To-do list">
      <div class="card-top">
        <div class="summary">
          <strong id="summary">Your day, your pace.</strong>
          <span id="progress-label">0% complete</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <form class="add-form" id="add-form">
        <input id="task-input" type="text" maxlength="180" autocomplete="off" placeholder="What would you like to get done?" aria-label="New task" required>
        <button class="add-button" type="submit">Add task</button>
      </form>

      <div class="list-header">
        <span>Tasks</span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <strong id="empty-title">Nothing on your list yet</strong>
        <span id="empty-hint">Add a task above and take it one step at a time.</span>
      </div>

      <footer class="card-footer">
        <span id="remaining-count">0 tasks left</span>
        <span>Saved on this device</span>
      </footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "my-todo-list.tasks.v1";
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#task-input");
    const list = document.querySelector("#task-list");
    const emptyState = document.querySelector("#empty-state");
    const navLinks = document.querySelectorAll(".nav-link");
    let currentFilter = "all";
    let tasks = loadTasks();

    document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    function setFilter(filter) {
      currentFilter = filter;
      navLinks.forEach(link => {
        if (link.dataset.filter === currentFilter) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      render();
    }

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [];
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || parsed.some(task =>
          !task || typeof task.id !== "string" || typeof task.text !== "string" || typeof task.done !== "boolean"
        )) {
          throw new Error("Saved to-do list has an invalid format.");
        }
        return parsed;
      } catch (error) {
        console.error("Could not load the saved to-do list.", error);
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.error("Could not save the to-do list to this device.", error);
      }
    }

    function render() {
      const activeTasks = tasks.filter(task => !task.done).length;
      const completedTasks = tasks.length - activeTasks;
      const percentage = tasks.length ? Math.round(completedTasks / tasks.length * 100) : 0;
      const visibleTasks = tasks.filter(task =>
        currentFilter === "all" ||
        (currentFilter === "active" && !task.done) ||
        (currentFilter === "done" && task.done)
      );

      document.querySelector("#summary").textContent = tasks.length
        ? activeTasks === 0 ? "Everything is checked off." : `${activeTasks} ${activeTasks === 1 ? "task" : "tasks"} to focus on.`
        : "Your day, your pace.";
      document.querySelector("#progress-label").textContent = `${percentage}% complete`;
      document.querySelector("#progress").setAttribute("aria-valuenow", String(percentage));
      document.querySelector("#progress-bar").style.width = `${percentage}%`;
      document.querySelector("#remaining-count").textContent =
        `${activeTasks} ${activeTasks === 1 ? "task" : "tasks"} left`;

      list.replaceChildren();
      for (const task of visibleTasks) {
        const item = document.createElement("li");
        item.className = `task${task.done ? " is-done" : ""}`;

        const toggle = document.createElement("button");
        toggle.className = "task-check";
        toggle.type = "button";
        toggle.setAttribute("aria-label", `${task.done ? "Mark as to do" : "Complete"}: ${task.text}`);
        toggle.setAttribute("aria-pressed", String(task.done));
        toggle.addEventListener("click", () => {
          task.done = !task.done;
          saveTasks();
          render();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete: ${task.text}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(candidate => candidate.id !== task.id);
          saveTasks();
          render();
        });

        item.append(toggle, text, remove);
        list.append(item);
      }

      const isEmpty = visibleTasks.length === 0;
      list.hidden = isEmpty;
      emptyState.hidden = !isEmpty;
      document.querySelector("#empty-title").textContent = tasks.length
        ? currentFilter === "active" ? "All caught up" : "No completed tasks yet"
        : "Nothing on your list yet";
      document.querySelector("#empty-hint").textContent = tasks.length
        ? currentFilter === "active" ? "Enjoy the breathing room, or add another task." : "Completed tasks will show up here."
        : "Add a task above and take it one step at a time.";
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      setFilter("all");
      saveTasks();
      form.reset();
      input.focus();
    });

    navLinks.forEach(link => {
      link.addEventListener("click", () => {
        setFilter(link.dataset.filter);
      });
    });

    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
